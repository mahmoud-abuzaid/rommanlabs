<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="رمان لابز" />
    <meta name="theme-color" content="#fafafa" />
    <title>رمان لابز</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>

    <div class="appbar">
        <a href="/" class="appbar-brand">
            <img src="logo.svg" alt="رمان لابز" class="appbar-logo" />
            <span>رمان لابز</span>
        </a>
        <div class="appbar-actions">
            <button class="theme-btn" id="theme-btn" aria-label="الوضع الداكن">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </div>

    <main class="hero">

        <div class="hero-badge">
            <span class="badge-dot"></span>
            <span>قيد الإطلاق</span>
        </div>

        <div class="hero-logo-wrapper">
            <img src="logo.svg" alt="" class="hero-logo" />
            <div class="hero-logo-glow"></div>
        </div>

        <h1 class="hero-title">
            <span class="hero-title-ar">رمان</span>
            <span class="hero-title-en">Romman Labs</span>
        </h1>

        <p class="hero-desc">
            نجمع بين أصالة التصميم وقوة التقنية<br class="br-d" />
            لنقدم لك تجربة رقمية استثنائية.
        </p>

        <div class="hero-chip">
            <span class="chip-text" id="chip-text"></span>
            <span class="cursor" id="cursor-word">|</span>
        </div>



        <p class="hero-footer">© 2026 رمان لابز</p>

    </main>

</body>
</html>
